name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: Core build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DmzCompanion.Core.slnf

      - name: Build
        run: dotnet build DmzCompanion.Core.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution DmzCompanion.Core.slnf --configuration Release --no-build

  app-windows:
    name: App build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      # Throwaway cert; only the public .cer leaves the runner.
      - name: Create self-signed cert
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=AtraTech' -KeyUsage DigitalSignature `
            -FriendlyName 'DMZ Companion CI' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(30) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          New-Item -ItemType Directory -Force -Path artifacts/msix | Out-Null
          Export-Certificate -Cert $cert -FilePath artifacts/msix/DmzCompanion-AtraTech.cer | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build signed MSIX
        run: >-
          dotnet publish src/DmzCompanion.App/DmzCompanion.App.csproj
          --configuration Release
          -f net10.0-windows10.0.19041.0
          -p:RuntimeIdentifierOverride=win-x64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          -p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/

      - uses: actions/upload-artifact@v4
        with:
          name: DmzCompanion-msix-selfsigned
          path: artifacts/msix/
          if-no-files-found: error
          retention-days: 14
