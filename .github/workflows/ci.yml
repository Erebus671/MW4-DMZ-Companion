name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: Core build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DmzCompanion.Core.slnf

      - name: Build
        run: dotnet build DmzCompanion.Core.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution DmzCompanion.Core.slnf --configuration Release --no-build

  app-windows:
    name: App build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build unsigned MSIX
        run: >-
          dotnet publish src/DmzCompanion.App/DmzCompanion.App.csproj
          --configuration Release
          -f net10.0-windows10.0.19041.0
          -p:RuntimeIdentifierOverride=win-x64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/

      - uses: actions/upload-artifact@v4
        with:
          name: DmzCompanion-msix-unsigned
          path: artifacts/msix/
          if-no-files-found: error
          retention-days: 14
